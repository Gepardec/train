---
- name: Generate Account private key
  become: true
  community.crypto.openssl_privatekey:
    path: "{{ account_key_dir }}/account.key"
    size: 4096

- name: Generate certificate private key
  become: true
  community.crypto.openssl_privatekey:
    path: "{{ cert_dir }}/privkey.pem"
    size: 2048

- name: Generate Certificate Signing Request (CSR)
  become: true
  community.crypto.openssl_csr:
    path: "{{ cert_dir }}/{{ domain_name }}.csr"
    privatekey_path: "{{ cert_dir }}/privkey.pem"
    common_name: "{{ domain_name }}"

- name: Register ACME Account
  become: true
  community.crypto.acme_account:
    account_key_src: "{{ account_key_dir }}/account.key"
    acme_directory: "{{ acme_directory }}"
    acme_version: 2
    state: present
    terms_agreed: yes
    contact:
      - "mailto:{{ acme_email }}"
    external_account_binding:
      alg: "HS256"
      kid: "{{ acme_eab_kid }}"
      key: "{{ acme_eab_hmac_key }}"
